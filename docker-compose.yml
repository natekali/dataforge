services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      # Use named volume path for better Docker Desktop performance
      - DATABASE_URL=sqlite+aiosqlite:///./data/dataforge.db
      - DUCKDB_PATH=./data/dataforge_analytics.duckdb
      - UPLOAD_DIR=./data/uploads
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Use named volume for database - MUCH faster than bind mounts on Docker Desktop
      # Note: Data persists in Docker volume but is not directly accessible from host
      - dataforge-data:/app/data
      - ./apps/api/src:/app/src:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Allow time for first-run database initialization
      start_period: 10s
    restart: unless-stopped

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Development services
  dev-api:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/dataforge.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./apps/api/src:/app/src
      - ./packages/core/src:/app/packages/core/src
      - ./data:/app/data
    command: uvicorn dataforge_api.main:app --host 0.0.0.0 --port 8000 --reload

  dev-web:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    command: pnpm dev

volumes:
  # Named volume for API data (database, uploads, etc.)
  # Much faster than bind mounts on Docker Desktop for Windows/Mac
  dataforge-data:
