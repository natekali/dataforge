[project]
name = "dataforge-core"
version = "0.1.0"
description = "DataForge Studio Core - Dataset processing engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "polars>=1.18.0",
    "orjson>=3.10.12",
    "chardet>=5.2.0",
    "jinja2>=3.1.4",
    "tiktoken>=0.8.0",
    "pydantic>=2.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge_core"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
